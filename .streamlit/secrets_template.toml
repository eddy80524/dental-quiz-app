# Streamlit Cloud Secrets Configuration Template
# このファイルはテンプレートです。実際のシークレットはStreamlit Cloudのダッシュボードで設定してください。

# Firebase configuration (Service Account JSON)
# Streamlit CloudのSecretsセクションで以下の内容を設定:
#
# [firebase]
# type = "service_account"
# project_id = "your-project-id"
# private_key_id = "your-private-key-id"
# private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
# client_email = "your-service-account-email"
# client_id = "your-client-id"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account-email"

# Authentication settings
# [auth]
# cookie_name = "dental_app_auth"
# cookie_key = "your_random_secret_key_here"
# cookie_expiry_days = 30

# Optional: Google Analytics
# google_analytics_id = "G-XXXXXXXXXX"

# Optional: LLM API Keys (if using external providers)
# HF_API_TOKEN = "your_huggingface_token"
# PROVIDER_API_KEY = "your_api_key"

# DEPLOYMENT INSTRUCTIONS:
# 1. Get Firebase Service Account JSON from Firebase Console
# 2. Copy all fields from the JSON to [firebase] section above
# 3. Generate a random cookie_key for [auth] section
# 4. Set these values in Streamlit Cloud App Dashboard -> Secrets
# 5. Main file path: my_llm_app/app.py
