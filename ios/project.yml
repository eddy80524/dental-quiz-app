name: DentalDX
options:
  minimumXcodeGenVersion: 2.35.0
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.kokushi.dentaldx
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  DentalDX:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Sources
        name: DentalDXSources
    resources:
      - path: Resources
    info:
      path: Support/Info.plist
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    prebuildScripts:
      - script: |
          if command -v mint >/dev/null 2>&1; then
            mint run swiftformat .
          fi
        name: SwiftFormat (optional)
